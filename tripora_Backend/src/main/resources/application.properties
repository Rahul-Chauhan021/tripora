spring.application.name=tripora_Backend

# ---------------------------------------------------------------------------
# Load secrets from tripora_Backend/.env (KEY=VALUE file). Real OS
# environment variables still take precedence. The import is 'optional' so
# the application also starts when no .env file is present and all values
# are provided through the environment instead.
# ---------------------------------------------------------------------------
spring.config.import=optional:file:.env[.properties]

# ---------------------------------------------------------------------------
# PostgreSQL datasource (configure through environment variables - never
# commit real credentials). The database itself is created and managed by
# you; this application only connects to it.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tripora_db}
spring.datasource.username=${DB_USERNAME:tripora_user}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# 'update' creates the tables owned by this application if they do not exist
# and preserves all existing tables and data otherwise.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# ---------------------------------------------------------------------------
# SMTP (Spring Boot Mail). All values come from environment variables.
# If MAIL_HOST is left empty the API responds with a clear 503 configuration
# error instead of pretending that an email was delivered.
# ---------------------------------------------------------------------------
app.mail.host=${MAIL_HOST:}
app.mail.port=${MAIL_PORT:587}
app.mail.username=${MAIL_USERNAME:}
app.mail.password=${MAIL_PASSWORD:}
app.mail.from=${MAIL_FROM:noreply@tripora.app}

# ---------------------------------------------------------------------------
# OTP policy
# ---------------------------------------------------------------------------
app.otp.expiry-minutes=5
app.otp.max-attempts=5
app.otp.resend-cooldown-seconds=60
app.otp.max-resends-per-hour=5

# ---------------------------------------------------------------------------
# CORS - the React dev server origin
# ---------------------------------------------------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
