spring.application.name=tripora_Backend-test

# In-memory H2 so the Spring context tests never touch the real PostgreSQL.
spring.datasource.url=jdbc:h2:mem:tripora_test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# Mail is deliberately unconfigured in tests; the email service is mocked in
# unit tests and reports a clear configuration error at runtime when unset.
app.mail.host=
app.mail.port=587
app.mail.username=
app.mail.password=
app.mail.from=noreply@tripora.test

app.otp.expiry-minutes=5
app.otp.max-attempts=5
app.otp.resend-cooldown-seconds=60
app.otp.max-resends-per-hour=5

app.cors.allowed-origins=http://localhost:5173
